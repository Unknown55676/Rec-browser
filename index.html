<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a27">
  <meta name="description" content="An independent browser-based 3D social room prototype.">
  <title>Rec-browser</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <main id="app">
    <div id="game-root" aria-label="3D game view"></div>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Rec-browser home"><span class="brand-mark">R</span><span>REC-BROWSER</span></a>
      <div class="status"><span id="connection-dot" class="dot"></span><span id="connection-label">Solo mode</span></div>
    </header>

    <section id="welcome" class="welcome-panel">
      <p class="eyebrow">INDEPENDENT SOCIAL WORLD</p>
      <h1>Your room.<br><span>Your world.</span></h1>
      <p class="intro">A new browser-based 3D hangout is just getting started.</p>
      <button id="play-button" class="primary-button">Play</button>
      <p class="hint">No account needed for this prototype.</p>
    </section>

    <section id="hud" class="hud hidden">
      <div class="room-label"><span class="live-dot"></span> THE LOBBY <small>PUBLIC ROOM</small></div>
      <div class="hud-actions"><button id="chat-toggle" class="small-button">Chat</button><button id="leave-button" class="small-button">Leave</button></div>
    </section>

    <section id="chat-panel" class="chat-panel hidden">
      <div class="chat-heading"><strong>Room chat</strong><button id="chat-close" aria-label="Close chat">×</button></div>
      <div id="chat-messages" class="chat-messages"><p class="system-message">Welcome to the lobby!</p></div>
      <form id="chat-form"><input id="chat-input" maxlength="180" autocomplete="off" placeholder="Say something…"><button type="submit">Send</button></form>
    </section>

    <div id="touch-controls" class="touch-controls hidden" aria-label="Touch movement controls">
      <div class="dpad">
        <button data-move="forward" aria-label="Move forward">▲</button>
        <div><button data-move="left" aria-label="Move left">◀</button><button data-move="back" aria-label="Move backward">▼</button><button data-move="right" aria-label="Move right">▶</button></div>
      </div>
      <div id="look-area" class="look-area">DRAG TO LOOK</div>
    </div>
    <div id="crosshair" class="crosshair hidden"></div>
    <div id="toast" class="toast hidden"></div>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
