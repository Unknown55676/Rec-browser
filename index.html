<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a27">
  <meta name="description" content="An independent browser-based 3D social world.">
  <title>Rec-browser</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js"></script>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
  </script>
</head>
<body>
  <main id="app">
    <div id="game-root" aria-label="3D game view"></div>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Rec-browser home"><span class="brand-mark">R</span><span>REC-BROWSER</span></a>
      <div class="status"><span id="connection-dot" class="dot"></span><span id="connection-label">Solo mode</span></div>
    </header>

    <section id="welcome" class="welcome-panel">
      <p class="eyebrow">INDEPENDENT SOCIAL WORLD</p>
      <h1>Your room.<br><span>Your world.</span></h1>
      <p class="intro">Meet up, move around, and chat in a shared browser world.</p>
      <label class="field-label" for="player-name">Display name</label>
      <input id="player-name" class="profile-input" maxlength="18" autocomplete="nickname" value="Guest">
      <label class="field-label" for="player-color">Avatar color</label>
      <div class="color-row">
        <button class="color-choice selected" data-color="#f05c7b" style="--swatch:#f05c7b" aria-label="Pink"></button>
        <button class="color-choice" data-color="#55b8e8" style="--swatch:#55b8e8" aria-label="Blue"></button>
        <button class="color-choice" data-color="#65d69b" style="--swatch:#65d69b" aria-label="Green"></button>
        <button class="color-choice" data-color="#a995f2" style="--swatch:#a995f2" aria-label="Purple"></button>
        <button class="color-choice" data-color="#f2bd59" style="--swatch:#f2bd59" aria-label="Yellow"></button>
      </div>
      <button id="play-button" class="primary-button">Play</button>
      <p class="hint">Your name and color are saved on this device.</p>
    </section>

    <section id="hud" class="hud hidden">
      <div class="room-label"><span class="live-dot"></span> THE LOBBY <small>PUBLIC ROOM</small><span id="player-count">1 here</span></div>
      <div class="hud-actions">
        <button id="emote-button" class="small-button" title="Wave">👋 Wave</button>
        <button id="chat-toggle" class="small-button">Chat</button>
        <button id="leave-button" class="small-button">Leave</button>
      </div>
    </section>

    <section id="chat-panel" class="chat-panel hidden">
      <div class="chat-heading"><strong>Room chat</strong><button id="chat-close" aria-label="Close chat">×</button></div>
      <div id="chat-messages" class="chat-messages"><p class="system-message">Welcome to the lobby!</p></div>
      <form id="chat-form"><input id="chat-input" maxlength="180" autocomplete="off" placeholder="Say something…"><button type="submit">Send</button></form>
    </section>

    <div id="touch-controls" class="touch-controls hidden" aria-label="Touch movement controls">
      <div class="dpad">
        <button data-move="forward" aria-label="Move forward">▲</button>
        <div><button data-move="left" aria-label="Move left">◀</button><button data-move="back" aria-label="Move backward">▼</button><button data-move="right" aria-label="Move right">▶</button></div>
      </div>
      <div id="look-area" class="look-area">DRAG TO LOOK</div>
    </div>
    <div id="crosshair" class="crosshair hidden"></div>
    <div id="toast" class="toast hidden" role="status"></div>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
